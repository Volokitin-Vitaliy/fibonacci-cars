{% extends "base.html" %}
{% comment %}
allauth's own pages (sign-in errors, the extra step when Google/Apple did not
share an email) are shown in the site layout.
{% endcomment %}
{% block extra_head %}
<style>
    main { max-width: 28rem; margin: 0 auto; padding: 5rem 1rem; width: 100%; }
    main h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; }
    main p { color: #a3a3a3; margin-bottom: 1rem; }
    main a { text-decoration: underline; }
    main label { display: block; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: #a3a3a3; margin: 1rem 0 .4rem; }
    main input:not([type=hidden]):not([type=checkbox]) { width: 100%; background: #141414; border: 1px solid #333; color: #f5f5f5; padding: .7rem .85rem; }
    main button { margin-top: 1.5rem; width: 100%; background: #f5f5f5; color: #0b0b0b; padding: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .8rem; }
    main .errorlist { color: #f87171; font-size: .85rem; }
</style>
{% endblock %}
