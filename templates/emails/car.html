{% load cars_tags %}{% with cover=car.cover %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:22px 0 4px;background:#0c0c0e;border:1px solid #232327;border-radius:14px;">
  {% if cover %}<tr><td><img src="{{ site_url }}{{ cover.image.url }}" width="494" alt="{{ car }}" style="display:block;width:100%;height:auto;border:0;border-radius:14px 14px 0 0;"></td></tr>{% endif %}
  <tr><td style="padding:16px 18px;">
    <div style="font:600 11px/1.4 Arial,Helvetica,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#737373;">{{ car.make.name }}</div>
    <div style="font:700 18px/1.35 Arial,Helvetica,sans-serif;color:#f5f5f5;margin-top:4px;">{{ car.model }}</div>
    {% if car.main_price %}<div style="font:700 16px/1.4 Arial,Helvetica,sans-serif;color:#f5f5f5;margin-top:8px;">{{ car.currency_symbol }}{{ car.main_price|money }}</div>{% endif %}
  </td></tr>
</table>{% endwith %}
