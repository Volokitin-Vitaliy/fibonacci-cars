{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light"><meta name="supported-color-schemes" content="dark light">
<title>FIBONACCI</title>
</head>
<body style="margin:0;padding:0;background:#08080a;">
<span style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#08080a;">
<tr><td align="center" style="padding:32px 16px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
    <tr><td align="center" style="padding:0 0 28px;">
      <a href="{{ site_url }}" style="text-decoration:none;">
        <img src="{{ logo_url }}" width="44" height="44" alt="" style="display:inline-block;vertical-align:middle;border:0;">
        <span style="display:inline-block;vertical-align:middle;margin-left:10px;font:600 15px/1 Arial,Helvetica,sans-serif;letter-spacing:5px;color:#f5f5f5;">FIBONACCI</span>
      </a>
    </td></tr>
    <tr><td style="background:#111113;border:1px solid #232327;border-radius:18px;padding:36px 32px;font:400 15px/1.65 Arial,Helvetica,sans-serif;color:#d4d4d4;">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td align="center" style="padding:24px 8px 0;font:400 12px/1.6 Arial,Helvetica,sans-serif;color:#6b6b6b;">
      {% block footer %}{% trans 'Exclusive cars worldwide.' %} · <a href="{{ site_url }}" style="color:#a3a3a3;">{{ site_url|cut:'https://'|cut:'http://' }}</a>{% endblock %}
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
