{% extends "base.html" %}
{% load i18n %}
{% block content %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="mb-10">
        <div class="text-xs uppercase tracking-[0.3em] text-neutral-500">{% trans 'Cabinet' %}</div>
        <h1 class="text-2xl sm:text-3xl font-bold mt-2">{{ user.full_name|default:user.email }}</h1>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-[14rem_1fr] gap-6 lg:gap-10">
        <aside class="min-w-0 -mx-4 px-4 sm:mx-0 sm:px-0 border-b border-neutral-900 lg:border-0">
            <nav class="flex lg:flex-col gap-1 text-sm uppercase tracking-wider overflow-x-auto whitespace-nowrap pb-px">
                <a href="{% url 'cars:my_cars' %}" class="px-3 py-3 lg:py-2 border-b-2 lg:border-b-0 lg:border-l-2 {% if section == 'cars' %}border-white text-white{% else %}border-transparent text-neutral-400 hover:text-white{% endif %}">{% trans 'My listings' %}</a>
                <a href="{% url 'cars:add' %}" class="px-3 py-3 lg:py-2 border-b-2 lg:border-b-0 lg:border-l-2 {% if section == 'add' %}border-white text-white{% else %}border-transparent text-neutral-400 hover:text-white{% endif %}">{% trans 'Add a vehicle' %}</a>
                <a href="{% url 'cars:favorites' %}" class="px-3 py-3 lg:py-2 border-b-2 lg:border-b-0 lg:border-l-2 {% if section == 'favorites' %}border-white text-white{% else %}border-transparent text-neutral-400 hover:text-white{% endif %}">{% trans 'Favorites' %}</a>
                <a href="{% url 'users:account' %}" class="px-3 py-3 lg:py-2 border-b-2 lg:border-b-0 lg:border-l-2 {% if section == 'account' %}border-white text-white{% else %}border-transparent text-neutral-400 hover:text-white{% endif %}">{% trans 'Account details' %}</a>
                <form method="post" action="{% url 'users:logout' %}">{% csrf_token %}<button class="px-3 py-3 lg:py-2 border-b-2 lg:border-b-0 lg:border-l-2 border-transparent text-neutral-400 hover:text-white uppercase tracking-wider text-left w-full">{% trans 'Log out' %}</button></form>
            </nav>
        </aside>
        <div class="min-w-0">{% block cabinet %}{% endblock %}</div>
    </div>
</section>
{% endblock %}
