{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 py-20 text-center">
    <div class="mx-auto w-16 h-16 rounded-full border border-white/15 grid place-items-center mb-8">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
    </div>
    <h1 class="text-2xl sm:text-3xl font-bold mb-4">{{ title }}</h1>
    <p class="text-neutral-400 leading-relaxed">{{ text }}</p>
    <form method="post" class="mt-10">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary w-full">{{ button }}</button>
    </form>
</section>
{% endblock %}
